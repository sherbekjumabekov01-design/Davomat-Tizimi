<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Davomat Tizimiga kirish">
  <title>Tizimga Kirish - Davomat Tizimi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 26, 47, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), var(--glow-shadow);
      animation: fadeIn 0.4s ease;
    }
    .login-logo {
      width: 54px;
      height: 54px;
      background: var(--primary-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.6rem;
      margin: 0 auto 1.25rem;
      box-shadow: var(--glow-shadow);
    }
    .demo-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">D</div>
      <h2 style="text-align:center; font-size:1.6rem; font-weight:800; margin-bottom:0.25rem; color:#FFFFFF;">Davomat Tizimi</h2>
      <p style="text-align:center; color:var(--text-secondary); font-size:0.875rem; margin-bottom:2rem;">
        Boshqaruv tizimiga xush kelibsiz
      </p>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Foydalanuvchi nomi</label>
          <input type="text" class="form-control" id="loginUsername" required placeholder="Masalan: admin" value="admin">
        </div>

        <div class="form-group">
          <label class="form-label">Parol</label>
          <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••" value="Admin123!">
        </div>

        <button type="submit" class="btn btn-primary" id="btnLoginSubmit" style="width:100%; padding:0.85rem; margin-top:0.75rem; font-size:0.95rem;">
          Tizimga kirish
        </button>
      </form>

      <!-- 1-Click Demo Quick Logins -->
      <div class="demo-box">
        <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:0.6rem;">
          Tezkor Demo hisoblar:
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="setDemo('admin', 'Admin123!')">
            Admin
          </button>
          <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="setDemo('alisher', 'Teacher123!')">
            O'qituvchi
          </button>
        </div>
      </div>

      <div style="text-align:center; margin-top:1.5rem;">
        <a href="../index.html" id="linkToHome" style="color:var(--text-accent); font-size:0.85rem; text-decoration:none;">
          ← Asosiy boshqaruv paneliga o'tish
        </a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (window.location.protocol !== 'file:') {
      const link = document.getElementById('linkToHome');
      if (link) link.href = '/';
    }

    function setDemo(u, p) {
      document.getElementById('loginUsername').value = u;
      document.getElementById('loginPassword').value = p;
      showToast(`${u} hisobi tanlandi. "Tizimga kirish" tugmasini bosing.`, 'info');
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Tekshirilmoqda...';

      try {
        await api.login(u, p);
        showToast('Muvaffaqiyatli kirdingiz! Yo\'naltirilmoqda...', 'success');
        setTimeout(() => {
          const homeUrl = window.location.protocol === 'file:' ? '../index.html' : '/';
          window.location.href = homeUrl;
        }, 600);
      } catch (err) {
        showToast(err.message || 'Login yoki parol noto\'g\'ri', 'error');
        btn.disabled = false;
        btn.textContent = 'Tizimga kirish';
      }
    }
  </script>
</body>
</html>
