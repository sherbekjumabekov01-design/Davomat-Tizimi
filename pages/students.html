<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talabalar - Davomat Tizimi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <div style="max-width:1200px; margin:2rem auto; padding:0 1.5rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <a href="../index.html" onclick="if(window.location.protocol!=='file:'){event.preventDefault();window.location.href='/';}" class="btn btn-secondary btn-sm">← Bosh sahifaga qaytish</a>
        <h2 style="font-size:1.5rem; font-weight:800; color:#FFFFFF;">Talabalar Bazasi</h2>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-secondary btn-sm" onclick="exportStudentsList()" title="Excel (CSV) yuklash">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Excelga yuklash
        </button>
        <button class="btn btn-primary btn-sm" onclick="openAddStudentModal()">+ Yangi talaba qo'shish</button>
      </div>
    </div>

    <div class="card">
      <div class="filter-bar">
        <div class="search-input-wrapper">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" class="form-control" id="studentsSearchInput" placeholder="Ism, talaba kodi yoki telefon bo'yicha qidirish..." oninput="loadStudentsView()">
        </div>
        <div style="width:200px;">
          <select class="form-control" id="studentsGroupFilter" onchange="loadStudentsView()">
            <option value="">Barcha guruhlar</option>
          </select>
        </div>
        <div style="width:170px;">
          <select class="form-control" id="studentsStatusFilter" onchange="loadStudentsView()">
            <option value="">Barcha holatlar</option>
            <option value="Active">Faol</option>
            <option value="Frozen">Muzlatilgan</option>
            <option value="Dropped">Tashlagan</option>
            <option value="Graduated">Bitirgan</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Talaba F.I.Sh.</th>
              <th>ID Kod</th>
              <th>Guruh</th>
              <th>Holati</th>
              <th>Telefon</th>
              <th>Ota-onasi</th>
              <th>Davomat %</th>
              <th>Amallar</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <tr><td colspan="8" style="text-align:center; padding:2rem;">Yuklanmoqda...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Student Add/Edit Modal -->
  <div class="modal-backdrop" id="studentModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="studentModalTitle">Yangi talaba qo'shish</h3>
        <button class="btn-close-modal" onclick="closeModal('studentModal')">✕</button>
      </div>
      <form id="studentForm" onsubmit="handleStudentFormSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="studentFormId">
          <div class="form-group">
            <label class="form-label">To'liq ismi (F.I.Sh.) *</label>
            <input type="text" class="form-control" id="studentFormName" required placeholder="Masalan: Sardor Aliyev">
          </div>
          <div class="form-group">
            <label class="form-label">Talaba kodi (ID) *</label>
            <input type="text" class="form-control" id="studentFormCode" required placeholder="Masalan: STD-21010">
          </div>
          <div class="form-group">
            <label class="form-label">Akademik guruh *</label>
            <select class="form-control" id="studentFormGroup" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Holati (Status)</label>
            <select class="form-control" id="studentFormStatus">
              <option value="Active">Faol (O'qimoqda)</option>
              <option value="Frozen">Muzlatilgan (Akademik ta'til)</option>
              <option value="Dropped">Tashlagan (O'qishni to'xtatgan)</option>
              <option value="Graduated">Bitirgan (Kursni tamomlagan)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Telefon raqami</label>
            <input type="text" class="form-control" id="studentFormPhone">
          </div>
          <div class="form-group">
            <label class="form-label">Ota-onasi F.I.Sh.</label>
            <input type="text" class="form-control" id="studentFormParentName" placeholder="Masalan: Jamshid Aliyev">
          </div>
          <div class="form-group">
            <label class="form-label">Ota-onasi telefon raqami</label>
            <input type="text" class="form-control" id="studentFormParentPhone">
          </div>
          <div class="form-group">
            <label class="form-label">Elektron pochta</label>
            <input type="email" class="form-control" id="studentFormEmail">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('studentModal')">Bekor qilish</button>
          <button type="submit" class="btn btn-primary">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Student History Modal -->
  <div class="modal-backdrop" id="studentHistoryModal">
    <div class="modal-container" style="max-width:680px;">
      <div class="modal-header">
        <h3 class="modal-title" id="studentHistoryTitle">Davomat tarixi</h3>
        <button class="btn-close-modal" onclick="closeModal('studentHistoryModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Sana</th>
                <th>Guruh</th>
                <th>Holat</th>
                <th>Izoh</th>
              </tr>
            </thead>
            <tbody id="studentHistoryTableBody">
              <tr><td colspan="4" style="text-align:center;">Yuklanmoqda...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('studentHistoryModal')">Yopish</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/students.js"></script>
  <script>
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.addEventListener('DOMContentLoaded', () => {
      loadStudentsView();
    });
  </script>
</body>
</html>
