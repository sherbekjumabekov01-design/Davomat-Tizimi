<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'qituvchilar - Davomat Tizimi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <div style="max-width:1200px; margin:2rem auto; padding:0 1.5rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <a href="../index.html" onclick="if(window.location.protocol!=='file:'){event.preventDefault();window.location.href='/';}" class="btn btn-secondary btn-sm">← Bosh sahifaga qaytish</a>
        <h2 style="font-size:1.5rem; font-weight:800; color:#FFFFFF;">O'qituvchilar Tarkibi</h2>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openAddTeacherModal()">+ O'qituvchi qo'shish</button>
    </div>

    <div class="card">
      <div class="filter-bar">
        <div class="search-input-wrapper">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" class="form-control" id="teachersSearchInput" placeholder="Ism, fan yoki email bo'yicha qidirish..." oninput="loadTeachersView()">
        </div>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>O'qituvchi F.I.Sh.</th>
              <th>Mutaxassislik / Fan</th>
              <th>Telefon</th>
              <th>Biriktirilgan Guruhlar</th>
              <th>Amallar</th>
            </tr>
          </thead>
          <tbody id="teachersTableBody">
            <tr><td colspan="5" style="text-align:center; padding:2rem;">Yuklanmoqda...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Teacher Add/Edit Modal -->
  <div class="modal-backdrop" id="teacherModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="teacherModalTitle">Yangi o'qituvchi</h3>
        <button class="btn-close-modal" onclick="closeModal('teacherModal')">✕</button>
      </div>
      <form id="teacherForm" onsubmit="handleTeacherFormSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="teacherFormId">
          <div class="form-group">
            <label class="form-label">F.I.Sh. *</label>
            <input type="text" class="form-control" id="teacherFormName" required placeholder="Masalan: Alisher Qodirov">
          </div>
          <div class="form-group">
            <label class="form-label">Mutaxassislik / Fan *</label>
            <input type="text" class="form-control" id="teacherFormSubject" required placeholder="Masalan: Dasturlash asoslari">
          </div>
          <div class="form-group">
            <label class="form-label">Elektron pochta</label>
            <input type="email" class="form-control" id="teacherFormEmail" placeholder="teacher@davomat.uz">
          </div>
          <div class="form-group">
            <label class="form-label">Telefon raqami</label>
            <input type="text" class="form-control" id="teacherFormPhone" placeholder="+998 90 123 45 67">
          </div>
          <div class="form-group">
            <label class="form-label">Dars o'tadigan guruhlari:</label>
            <div id="teacherGroupsCheckboxList" style="display:flex; flex-direction:column; gap:0.4rem; padding:0.5rem; background:rgba(0,0,0,0.2); border-radius:var(--radius-sm);"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('teacherModal')">Bekor qilish</button>
          <button type="submit" class="btn btn-primary">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/teachers.js"></script>
  <script>
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.addEventListener('DOMContentLoaded', () => {
      loadTeachersView();
    });
  </script>
</body>
</html>
